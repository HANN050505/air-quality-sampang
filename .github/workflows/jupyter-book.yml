name: Build and Deploy Jupyter Book

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r materi/requirements.txt
          pip install jupyter-book==1.0.4.post1

      - name: Check Jupyter Book
        run: |
          jupyter-book --version
          which jupyter-book

      - name: Build Jupyter Book
        run: |
          jupyter-book build materi

      - name: Check build result
        run: |
          echo "=== BUILD DIRECTORY ==="
          ls -lah materi/_build

          echo "=== HTML DIRECTORY ==="
          ls -lah materi/_build/html

          echo "=== INDEX FILE ==="
          test -f materi/_build/html/index.html
          echo "index.html ditemukan!"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Jupyter Book
        uses: actions/upload-pages-artifact@v3
        with:
          path: materi/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4